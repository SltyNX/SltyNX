<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 168" width="380" height="168" role="img" aria-label="SLYTNX Footer">
  <title>SLYTNX Footer (Mobile)</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .cur { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect x="0" y="0" width="380" height="168" rx="7" fill="#000000"/>
  <line x1="16" y1="2" x2="364" y2="2" stroke="#303030" stroke-width="1.2"/>

  <g class="sltynx-emblem"><polygon points="190.0,16.0 169.5,46.2 210.5,46.2" fill="none" stroke="#F2F2F2" stroke-width="1.40" stroke-linejoin="miter" stroke-miterlimit="10"/><polygon points="190.0,23.0 169.5,53.3 210.5,53.3" fill="none" stroke="#F2F2F2" stroke-width="1.40" stroke-linejoin="miter" stroke-miterlimit="10"/><polygon points="190.0,30.0 169.5,60.3 210.5,60.3" fill="#F2F2F2"/></g>

  <text x="190" y="84" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#F2F2F2" letter-spacing="4">SLYTNX</text>
  <text x="190" y="108" text-anchor="middle" class="mono" font-size="14" fill="#A6A6A6" letter-spacing="1.5">sleep • code • create</text>
  <text x="190" y="132" text-anchor="middle" class="sans" font-size="14.5" font-weight="600" fill="#F2F2F2">Thanks for visiting!</text>
  <text x="184" y="154" text-anchor="middle" class="mono" font-size="13" fill="#6E6E6E">Still loading...</text>
  <rect x="242" y="142" width="7" height="13" fill="#6E6E6E" class="cur"/>
</svg>
