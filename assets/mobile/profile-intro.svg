<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 276" width="380" height="276" role="img" aria-label="Profile Introduction Terminal">
  <title>Profile Introduction — SltyNX (Mobile)</title>
  <defs><clipPath id="mpiClip0"><rect x="14" y="46" width="352" height="24" class="mpiline0"/></clipPath><clipPath id="mpiClip1"><rect x="14" y="78" width="352" height="24" class="mpiline1"/></clipPath><clipPath id="mpiClip2"><rect x="14" y="102" width="352" height="24" class="mpiline2"/></clipPath><clipPath id="mpiClip3"><rect x="14" y="126" width="352" height="24" class="mpiline3"/></clipPath><clipPath id="mpiClip4"><rect x="14" y="158" width="352" height="24" class="mpiline4"/></clipPath><clipPath id="mpiClip5"><rect x="14" y="182" width="352" height="24" class="mpiline5"/></clipPath><clipPath id="mpiClip6"><rect x="14" y="206" width="352" height="24" class="mpiline6"/></clipPath></defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .mpiline0 { animation: mpiType0 12s steps(36, end) infinite; }
    @keyframes mpiType0 {
      0%, 3% { width: 0px; }
      12%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline1 { animation: mpiType1 12s steps(36, end) infinite; }
    @keyframes mpiType1 {
      0%, 15% { width: 0px; }
      27%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline2 { animation: mpiType2 12s steps(36, end) infinite; }
    @keyframes mpiType2 {
      0%, 27% { width: 0px; }
      39%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline3 { animation: mpiType3 12s steps(36, end) infinite; }
    @keyframes mpiType3 {
      0%, 39% { width: 0px; }
      50%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline4 { animation: mpiType4 12s steps(36, end) infinite; }
    @keyframes mpiType4 {
      0%, 54% { width: 0px; }
      65%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline5 { animation: mpiType5 12s steps(36, end) infinite; }
    @keyframes mpiType5 {
      0%, 65% { width: 0px; }
      77%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
.mpiline6 { animation: mpiType6 12s steps(36, end) infinite; }
    @keyframes mpiType6 {
      0%, 77% { width: 0px; }
      88%, 94% { width: 352px; }
      98%, 100% { width: 0px; }
    }
    .pi-cur { animation: piBlink 1s steps(2, start) infinite; }
    @keyframes piBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .mpiline0, .mpiline1, .mpiline2, .mpiline3, .mpiline4, .mpiline5, .mpiline6 { animation: none !important; width: 352px !important; }
    }
  </style>

  <rect x="0" y="0" width="380" height="276" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="378" height="274" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <rect x="1.5" y="1.5" width="377" height="34" rx="6" fill="#080808"/>
  <line x1="1" y1="36" x2="379" y2="36" stroke="#303030" stroke-width="1"/>
  <circle cx="18" cy="18.5" r="4" fill="#383838"/>
  <circle cx="32" cy="18.5" r="4" fill="#383838"/>
  <circle cx="46" cy="18.5" r="4" fill="#383838"/>
  <text x="62" y="23" class="mono" font-size="12.5" fill="#A6A6A6">sltynx@sleeping-core: ~/intro</text>

  <text x="18" y="64" clip-path="url(#mpiClip0)" class="mono" font-size="14" font-weight="700" fill="#F2F2F2" xml:space="preserve">$ cat profile_intro.txt</text><text x="18" y="96" clip-path="url(#mpiClip1)" class="mono" font-size="14" fill="#F2F2F2" xml:space="preserve">&gt; Just a guy who sleeps a lot,</text><text x="18" y="120" clip-path="url(#mpiClip2)" class="mono" font-size="14" fill="#F2F2F2" xml:space="preserve">  codes a little, and dreams of</text><text x="18" y="144" clip-path="url(#mpiClip3)" class="mono" font-size="14" fill="#F2F2F2" xml:space="preserve">  building something cool.</text><text x="18" y="176" clip-path="url(#mpiClip4)" class="mono" font-size="14" fill="#A6A6A6" xml:space="preserve">&gt; Currently a noob developer.</text><text x="18" y="200" clip-path="url(#mpiClip5)" class="mono" font-size="14" fill="#A6A6A6" xml:space="preserve">  Learning as I go, breaking things</text><text x="18" y="224" clip-path="url(#mpiClip6)" class="mono" font-size="14" fill="#A6A6A6" xml:space="preserve">  occasionally, &amp; trying to learn.</text>

  <text x="18" y="256" class="mono" font-size="14" fill="#6E6E6E">$ </text>
  <rect x="36" y="243" width="8" height="15" fill="#F2F2F2" class="pi-cur"/>
</svg>
