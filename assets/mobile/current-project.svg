<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img" aria-label="Current Project: Gnosis Keyboard (In Progress)">
  <title>Current Projects — Gnosis Keyboard (In Progress)</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .key-press rect { animation: keyTap 4s ease-in-out infinite; }
    .key-press text { animation: keyText 4s ease-in-out infinite; }
    @keyframes keyTap {
      0%, 80%, 100% { fill: #0D0D0D; stroke: #303030; }
      10%, 25% { fill: #F2F2F2; stroke: #F2F2F2; }
    }
    @keyframes keyText {
      0%, 80%, 100% { fill: #A6A6A6; }
      10%, 25% { fill: #000000; font-weight: 700; }
    }
    .pulse-dot { animation: pDot 2.4s ease-in-out infinite; }
    @keyframes pDot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .key-press rect, .key-press text, .pulse-dot { animation: none !important; }
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="0" y="0" width="640" height="316" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="638" height="314" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

