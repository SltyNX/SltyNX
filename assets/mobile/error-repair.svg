<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 420" width="380" height="420" role="img" aria-label="Simulated Error &amp; Repair">
  <title>Simulated Error &amp; Repair (Mobile)</title>
  <defs>
    <clipPath id="mTruckClip">
      <rect x="16" y="236" width="348" height="168" rx="6"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .err-line { animation: showErr 14s linear infinite; }
    @keyframes showErr { 0%, 4% { opacity: 0; } 6%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .req-line { animation: showReq 14s linear infinite; }
    @keyframes showReq { 0%, 16% { opacity: 0; } 20%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .fix-line { animation: showFix 14s linear infinite; }
    @keyframes showFix { 0%, 46% { opacity: 0; } 50%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .ok-line { animation: showOk 14s linear infinite; }
    @keyframes showOk { 0%, 68% { opacity: 0; } 72%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .prog-fill { animation: progBar 14s ease-in-out infinite; }
    @keyframes progBar {
      0%, 46% { width: 0px; fill: #6E6E6E; }
      68% { width: 230px; fill: #F2F2F2; }
      72%, 92% { width: 230px; fill: #4ADE80; }
      97%, 100% { width: 0px; }
    }
    .truck-rig { animation: truckDrive 14s ease-in-out infinite; }
    @keyframes truckDrive {
      0%, 20% { transform: translateX(200px); opacity: 0; }
      24% { opacity: 1; }
      36%, 74% { transform: translateX(0px); opacity: 1; }
      88% { transform: translateX(-220px); opacity: 1; }
      92%, 100% { transform: translateX(-240px); opacity: 0; }
    }
    .worker-fix { animation: workerAct 14s linear infinite; }
    @keyframes workerAct { 0%, 36% { opacity: 0; } 40%, 68% { opacity: 1; } 72%, 100% { opacity: 0; } }
    .warn-badge { animation: warnState 14s linear infinite; }
    @keyframes warnState { 0%, 5% { opacity: 0; } 8%, 68% { opacity: 1; } 72%, 100% { opacity: 0; } }
    .fixed-badge { animation: showOk 14s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .err-line, .req-line, .fix-line, .ok-line, .fixed-badge, .truck-rig, .worker-fix { animation: none !important; opacity: 1 !important; transform: none !important; }
      .warn-badge { display: none !important; }
      .prog-fill { animation: none !important; width: 230px !important; fill: #4ADE80 !important; }
    }
  </style>

  <rect x="0" y="0" width="380" height="420" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="378" height="418" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <rect x="1.5" y="1.5" width="377" height="34" rx="6" fill="#080808"/>
  <line x1="1" y1="36" x2="379" y2="36" stroke="#303030" stroke-width="1"/>
  <text x="16" y="23" class="mono" font-size="13.5" font-weight="700" fill="#F2F2F2">// Simulated Error &amp; Repair</text>
  <text x="364" y="23" text-anchor="end" class="mono" font-size="11.5" fill="#A6A6A6">debug-sim</text>

  <text x="20" y="66" class="mono err-line" font-size="14.5" font-weight="700" fill="#F87171">! error: something went wrong</text>
  <text x="20" y="94" class="mono err-line" font-size="14" fill="#A6A6A6">&gt; diagnosis: developer confusion</text>
  <text x="20" y="122" class="mono req-line" font-size="14" fill="#A6A6A6">&gt; requesting assistance...</text>
  <text x="20" y="150" class="mono fix-line" font-size="14" fill="#F2F2F2">&gt; applying fix...</text>

  <g class="fix-line">
    <rect x="20" y="164" width="230" height="13" rx="3.5" fill="#080808" stroke="#303030" stroke-width="1"/>
    <rect x="20" y="164" width="230" height="13" rx="3.5" fill="#4ADE80" class="prog-fill"/>
    <text x="260" y="175" class="mono" font-size="12" fill="#6E6E6E">repair_job</text>
  </g>

  <text x="20" y="206" class="mono ok-line" font-size="14" font-weight="700" fill="#4ADE80">&#10003; build successful (simulated)</text>

  <line x1="16" y1="224" x2="364" y2="224" stroke="#303030" stroke-width="1"/>

  <rect x="16" y="236" width="348" height="168" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>

  <g clip-path="url(#mTruckClip)">
    <g transform="translate(54, 298)">
      <circle cx="0" cy="0" r="20" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
      <path d="M -20 0 C -20 -26, 20 -26, 20 0 C 14 -10, 4 -8, -2 -4 L -8 -12 L -14 -4 Z" fill="#1A1A1A"/>
      <line x1="-9" y1="2" x2="-3" y2="2" stroke="#000000" stroke-width="2"/>
      <line x1="3" y1="2" x2="9" y2="2" stroke="#000000" stroke-width="2"/>
      <text x="24" y="-6" class="mono warn-badge" font-size="14" font-weight="700" fill="#A6A6A6">?</text>
    </g>

    <g class="warn-badge">
      <rect x="104" y="290" width="66" height="44" rx="4" fill="#140C0C" stroke="#F87171" stroke-width="1.3"/>
      <polygon points="137,298 127,316 147,316" fill="none" stroke="#FBBF24" stroke-width="1.4"/>
      <text x="137" y="314" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FBBF24">!</text>
      <text x="137" y="328" text-anchor="middle" class="mono" font-size="9.5" font-weight="600" fill="#F87171">ERR_01</text>
    </g>

    <g class="fixed-badge">
      <rect x="104" y="290" width="66" height="44" rx="4" fill="#0B140E" stroke="#4ADE80" stroke-width="1.3"/>
      <text x="137" y="313" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#4ADE80">&#10003;</text>
      <text x="137" y="327" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#4ADE80">FIXED</text>
    </g>

    <g class="worker-fix">
      <rect x="180" y="338" width="12" height="18" rx="2" fill="#2A2A2A" stroke="#A6A6A6" stroke-width="1"/>
      <circle cx="186" cy="331" r="6" fill="#E5E5E5"/>
      <path d="M 178 330 C 178 323, 194 323, 194 330 Z" fill="#FBBF24"/>
      <line x1="182" y1="340" x2="170" y2="324" stroke="#F2F2F2" stroke-width="2.2" stroke-linecap="round"/>
      <text x="172" y="318" class="mono" font-size="11" fill="#FBBF24">*</text>
    </g>

    <g class="truck-rig">
      <rect x="234" y="294" width="114" height="32" rx="3" fill="#000000" stroke="#FBBF24" stroke-width="1.3"/>
      <text x="291" y="314" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#F2F2F2">[ AI ASSIST ]</text>
      <rect x="228" y="326" width="122" height="24" rx="2" fill="#1C1C1C" stroke="#A6A6A6" stroke-width="1.2"/>
      <polygon points="198,328 210,308 228,308 228,350 198,350" fill="#262626" stroke="#F2F2F2" stroke-width="1.2"/>
      <rect x="214" y="302" width="8" height="5" rx="1.5" fill="#FBBF24"/>
      <circle cx="214" cy="352" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
      <circle cx="264" cy="352" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
      <circle cx="324" cy="352" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
    </g>

    <line x1="26" y1="362" x2="354" y2="362" stroke="#303030" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="190" y="388" text-anchor="middle" class="mono" font-size="12" fill="#6E6E6E">lane: emergency_patch_unit.exe</text>
  </g>
</svg>
