<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 396" width="380" height="396" role="img" aria-label="Terminal Session Scenes A and B">
  <title>Terminal Session — Running Out of Ideas (Mobile)</title>
  <defs><clipPath id="mtsClip0"><rect x="16" y="50" width="348" height="24" class="mtline0"/></clipPath><clipPath id="mtsClip1"><rect x="16" y="78" width="348" height="24" class="mtline1"/></clipPath><clipPath id="mtsClip2"><rect x="16" y="106" width="348" height="24" class="mtline2"/></clipPath><clipPath id="mtsClip3"><rect x="16" y="134" width="348" height="24" class="mtline3"/></clipPath><clipPath id="mtsClip4"><rect x="16" y="162" width="348" height="24" class="mtline4"/></clipPath></defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .mtline0 { animation: mtypeL0 12s steps(32, end) infinite; }
    @keyframes mtypeL0 {
      0%, 4% { width: 0px; }
      14%, 92% { width: 348px; }
      96%, 100% { width: 0px; }
    }
.mtline1 { animation: mtypeL1 12s steps(32, end) infinite; }
    @keyframes mtypeL1 {
      0%, 18% { width: 0px; }
      28%, 92% { width: 348px; }
      96%, 100% { width: 0px; }
    }
.mtline2 { animation: mtypeL2 12s steps(32, end) infinite; }
    @keyframes mtypeL2 {
      0%, 33% { width: 0px; }
      44%, 92% { width: 348px; }
      96%, 100% { width: 0px; }
    }
.mtline3 { animation: mtypeL3 12s steps(32, end) infinite; }
    @keyframes mtypeL3 {
      0%, 49% { width: 0px; }
      58%, 92% { width: 348px; }
      96%, 100% { width: 0px; }
    }
.mtline4 { animation: mtypeL4 12s steps(32, end) infinite; }
    @keyframes mtypeL4 {
      0%, 63% { width: 0px; }
      75%, 92% { width: 348px; }
      96%, 100% { width: 0px; }
    }
    .thought-bubble { animation: bubbleShow 12s ease-in-out infinite; }
    @keyframes bubbleShow {
      0%, 54% { opacity: 0; transform: translateY(4px); }
      60%, 92% { opacity: 1; transform: translateY(0px); }
      96%, 100% { opacity: 0; transform: translateY(4px); }
    }
    .mascot-nod { animation: headNod 4s ease-in-out infinite; }
    @keyframes headNod { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(2px); } }
    .cur { animation: cBlink 1s steps(2, start) infinite; }
    @keyframes cBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .mtline0, .mtline1, .mtline2, .mtline3, .mtline4 { animation: none !important; width: 348px !important; }
      .thought-bubble { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <rect x="0" y="0" width="380" height="396" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="378" height="394" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <rect x="1.5" y="1.5" width="377" height="34" rx="6" fill="#080808"/>
  <line x1="1" y1="36" x2="379" y2="36" stroke="#303030" stroke-width="1"/>
  <circle cx="18" cy="18.5" r="4" fill="#383838"/>
  <circle cx="32" cy="18.5" r="4" fill="#383838"/>
  <circle cx="46" cy="18.5" r="4" fill="#383838"/>
  <text x="62" y="23" class="mono" font-size="12.5" fill="#A6A6A6">scene 01 // running out of ideas</text>

  <text x="20" y="68" clip-path="url(#mtsClip0)" class="mono" font-size="14.5" font-weight="700" fill="#F2F2F2">$ start-project</text><text x="20" y="96" clip-path="url(#mtsClip1)" class="mono" font-size="14.5" fill="#A6A6A6">&gt; opening the editor...</text><text x="20" y="124" clip-path="url(#mtsClip2)" class="mono" font-size="14.5" fill="#A6A6A6">&gt; thinking of an idea...</text><text x="20" y="152" clip-path="url(#mtsClip3)" class="mono" font-size="14.5" fill="#F87171">&gt; no ideas found.</text><text x="20" y="180" clip-path="url(#mtsClip4)" class="mono" font-size="14.5" fill="#A6A6A6">&gt; searching for motivation...</text>

  <text x="20" y="206" class="mono" font-size="14.5" fill="#6E6E6E">$ </text>
  <rect x="38" y="193" width="8" height="15" fill="#F2F2F2" class="cur"/>

  <line x1="16" y1="220" x2="364" y2="220" stroke="#303030" stroke-width="1"/>

  <!-- Scene B: Mascot at Laptop -->
  <rect x="16" y="230" width="348" height="150" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>
  <line x1="32" y1="346" x2="348" y2="346" stroke="#303030" stroke-width="1.5"/>

  <rect x="52" y="326" width="18" height="20" rx="2" fill="#0D0D0D" stroke="#6E6E6E" stroke-width="1.2"/>
  <path d="M 70 330 C 75 330, 75 342, 70 342" fill="none" stroke="#6E6E6E" stroke-width="1.2"/>

  <g class="mascot-nod">
    <rect x="150" y="304" width="48" height="42" rx="8" fill="#222222" stroke="#A6A6A6" stroke-width="1.2"/>
    <circle cx="174" cy="274" r="26" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
    <path d="M 147 274 C 147 240, 201 240, 201 274 C 195 260, 184 264, 176 270 L 170 260 L 162 270 L 154 262 Z" fill="#1A1A1A"/>
    <line x1="162" y1="278" x2="170" y2="278" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="178" y1="278" x2="186" y2="278" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <polygon points="114,308 168,308 176,344 122,344" fill="#141414" stroke="#A6A6A6" stroke-width="1.3"/>
  <rect x="118" y="342" width="76" height="4" rx="1.5" fill="#A6A6A6"/>

  <g class="thought-bubble">
    <circle cx="208" cy="260" r="3" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1"/>
    <circle cx="218" cy="252" r="4.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1"/>
    <rect x="226" y="238" width="128" height="36" rx="6" fill="#000000" stroke="#A6A6A6" stroke-width="1.2"/>
    <text x="290" y="261" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">...what now?</text>
  </g>

  <text x="190" y="368" text-anchor="middle" class="mono" font-size="12.5" fill="#6E6E6E">status: staring at blank editor</text>
</svg>
