<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Terminal Session — Starting Work and Running Out of Ideas (Scenes A and B)">
  <title>Terminal Session — Starting Work &amp; Running Out of Ideas (Scenes A &amp; B)</title>
  <defs>
    <clipPath id="tsClip0"><rect x="20" y="54" width="580" height="28" class="tline0"/></clipPath><clipPath id="tsClip1"><rect x="20" y="84" width="580" height="28" class="tline1"/></clipPath><clipPath id="tsClip2"><rect x="20" y="114" width="580" height="28" class="tline2"/></clipPath><clipPath id="tsClip3"><rect x="20" y="144" width="580" height="28" class="tline3"/></clipPath><clipPath id="tsClip4"><rect x="20" y="174" width="580" height="28" class="tline4"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .tline0 { animation: typeL0 12s steps(36, end) infinite; }
    @keyframes typeL0 {
      0%, 4% { width: 0px; }
      14%, 92% { width: 580px; }
      96%, 100% { width: 0px; }
    }
.tline1 { animation: typeL1 12s steps(36, end) infinite; }
    @keyframes typeL1 {
      0%, 18% { width: 0px; }
      28%, 92% { width: 580px; }
      96%, 100% { width: 0px; }
    }
.tline2 { animation: typeL2 12s steps(36, end) infinite; }
    @keyframes typeL2 {
      0%, 33% { width: 0px; }
      44%, 92% { width: 580px; }
      96%, 100% { width: 0px; }
    }
.tline3 { animation: typeL3 12s steps(36, end) infinite; }
    @keyframes typeL3 {
      0%, 49% { width: 0px; }
      58%, 92% { width: 580px; }
      96%, 100% { width: 0px; }
    }
.tline4 { animation: typeL4 12s steps(36, end) infinite; }
    @keyframes typeL4 {
      0%, 63% { width: 0px; }
      75%, 92% { width: 580px; }
      96%, 100% { width: 0px; }
    }

    .thought-bubble { animation: bubbleShow 12s ease-in-out infinite; }
    @keyframes bubbleShow {
      0%, 54% { opacity: 0; transform: translateY(4px); }
      60%, 92% { opacity: 1; transform: translateY(0px); }
      96%, 100% { opacity: 0; transform: translateY(4px); }
    }

    .mascot-nod { animation: headNod 4s ease-in-out infinite; }
    @keyframes headNod {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(2.2px); }
    }

    .cur { animation: cBlink 1s steps(2, start) infinite; }
    @keyframes cBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .tline0, .tline1, .tline2, .tline3, .tline4 { animation: none !important; width: 580px !important; }
      .thought-bubble { animation: none !important; opacity: 1 !important; transform: none !important; }
      .mascot-nod, .cur { animation: none !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="640" height="420" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="638" height="418" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <!-- Top Terminal Header -->
  <rect x="1.5" y="1.5" width="637" height="36" rx="6" fill="#080808"/>
  <line x1="1" y1="38" x2="639" y2="38" stroke="#303030" stroke-width="1"/>
  <circle cx="22" cy="19.5" r="4.5" fill="#383838"/>
  <circle cx="38" cy="19.5" r="4.5" fill="#383838"/>
  <circle cx="54" cy="19.5" r="4.5" fill="#383838"/>
  <text x="74" y="24" class="mono" font-size="13.5" fill="#A6A6A6">sltynx@desk: ~/projects (scene 01 // running out of ideas)</text>

  <!-- =================================================================== -->
  <!-- SCENE A (TOP): Terminal Typing Sequence                             -->
  <!-- =================================================================== -->
  <text x="26" y="74" clip-path="url(#tsClip0)" class="mono" font-size="16" font-weight="700" fill="#F2F2F2">$ start-project</text><text x="26" y="104" clip-path="url(#tsClip1)" class="mono" font-size="16" fill="#A6A6A6">&gt; opening the editor...</text><text x="26" y="134" clip-path="url(#tsClip2)" class="mono" font-size="16" fill="#A6A6A6">&gt; thinking of an idea...</text><text x="26" y="164" clip-path="url(#tsClip3)" class="mono" font-size="16" fill="#F87171">&gt; no ideas found.</text><text x="26" y="194" clip-path="url(#tsClip4)" class="mono" font-size="16" fill="#A6A6A6">&gt; searching for motivation...</text>

  <!-- Blinking Terminal Cursor -->
  <text x="26" y="220" class="mono" font-size="16" fill="#6E6E6E">$ </text>
  <rect x="46" y="206" width="9" height="16" fill="#F2F2F2" class="cur"/>

  <!-- Horizontal Divider -->
  <line x1="20" y1="234" x2="620" y2="234" stroke="#303030" stroke-width="1"/>

  <!-- =================================================================== -->
  <!-- SCENE B (BOTTOM): Sleepy Mascot at Laptop + "...what now?" Bubble   -->
  <!-- =================================================================== -->
  <rect x="20" y="246" width="600" height="156" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>

  <!-- Desk Surface -->
  <line x1="40" y1="368" x2="596" y2="368" stroke="#303030" stroke-width="1.5"/>

  <!-- Coffee Mug on Desk -->
  <rect x="148" y="346" width="20" height="22" rx="2.5" fill="#0D0D0D" stroke="#6E6E6E" stroke-width="1.3"/>
  <path d="M 168 351 C 174 351, 174 363, 168 363" fill="none" stroke="#6E6E6E" stroke-width="1.3"/>

  <!-- Sleepy Mascot Sitting Behind Laptop -->
  <g class="mascot-nod">
    <rect x="278" y="326" width="48" height="42" rx="8" fill="#222222" stroke="#A6A6A6" stroke-width="1.2"/>
    <circle cx="302" cy="296" r="27" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
    <path d="M 275 296 C 275 262, 329 262, 329 296 C 323 282, 312 286, 304 292 L 298 282 L 290 292 L 282 284 Z" fill="#1A1A1A" stroke="#6E6E6E" stroke-width="1.1"/>
    <line x1="290" y1="300" x2="298" y2="300" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="306" y1="300" x2="314" y2="300" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 322 290 Q 325 296 322 298 Q 319 296 322 290 Z" fill="#A6A6A6"/>
  </g>

  <!-- Laptop on Desk -->
  <polygon points="242,330 296,330 304,366 250,366" fill="#141414" stroke="#A6A6A6" stroke-width="1.3"/>
  <polygon points="273,344 269,351 277,351" fill="#F2F2F2"/>
  <rect x="246" y="364" width="76" height="4" rx="1.5" fill="#A6A6A6"/>

  <!-- Thought Bubble: "...what now?" -->
  <g class="thought-bubble">
    <circle cx="338" cy="278" r="3.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/>
    <circle cx="352" cy="268" r="5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/>
    <rect x="364" y="252" width="166" height="40" rx="6" fill="#000000" stroke="#A6A6A6" stroke-width="1.3"/>
    <text x="447" y="277" text-anchor="middle" class="mono" font-size="15.5" font-weight="700" fill="#F2F2F2">...what now?</text>
  </g>

  <text x="320" y="391" text-anchor="middle" class="mono" font-size="13" fill="#6E6E6E">status: staring at blank editor</text>
</svg>
