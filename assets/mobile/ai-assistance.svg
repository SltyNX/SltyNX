  <rect x="16" y="340" width="348" height="140" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>
  <line x1="32" y1="448" x2="348" y2="448" stroke="#303030" stroke-width="1.5"/>

  <g transform="translate(114, 392)">
    <rect x="-22" y="20" width="44" height="36" rx="7" fill="#242424" stroke="#A6A6A6" stroke-width="1.2"/>
    <circle cx="0" cy="-6" r="24" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
    <path d="M -24 -6 C -24 -36, 24 -36, 24 -6 C 18 -18, 8 -14, 2 -8 L -4 -18 L -11 -8 L -18 -16 Z" fill="#1A1A1A"/>
