    .resp1 { animation: rLine1 12s steps(24, end) infinite; }
    .resp2 { animation: rLine2 12s steps(24, end) infinite; }
    @keyframes rLine0 { 0%, 48% { opacity: 0; } 52%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
