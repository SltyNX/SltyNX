  <text x="30" y="282" class="mono resp1" font-size="14.5" fill="#F2F2F2">&gt; trying to understand...</text>
  <text x="30" y="310" class="mono resp2" font-size="14.5" fill="#A6A6A6">&gt; implementing solution...</text>

