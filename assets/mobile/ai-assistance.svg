  <g><rect x="16" y="48" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/><path d="M 38 64 V 82 M 29 73 H 47 M 31 66 L 45 80 M 45 66 L 31 80" stroke="#F2F2F2" stroke-width="1.6"/><text x="58" y="78" class="sans" font-size="14.5" font-weight="700" fill="#F2F2F2">Claude — Sonnet</text><g class="pop0"><rect x="192" y="58" width="162" height="30" rx="4" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1" stroke-dasharray="3 2"/><text x="273" y="77" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#F2F2F2">asking for a hint...</text></g></g><g><rect x="16" y="106" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/><polygon points="38,121 41.5,128 49,131 41.5,134 38,141 34.5,134 27,131 34.5,128" fill="none" stroke="#F2F2F2" stroke-width="1.5"/><text x="58" y="136" class="sans" font-size="14.5" font-weight="700" fill="#F2F2F2">Gemini</text><g class="pop1"><rect x="192" y="116" width="162" height="30" rx="4" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1" stroke-dasharray="3 2"/><text x="273" y="135" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#F2F2F2">idea detected?</text></g></g><g><rect x="16" y="164" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/><polygon points="38,180 46,184.5 46,193.5 38,198 30,193.5 30,184.5" fill="none" stroke="#F2F2F2" stroke-width="1.5"/><text x="58" y="194" class="sans" font-size="14.5" font-weight="700" fill="#F2F2F2">ChatGPT</text><g class="pop2"><rect x="192" y="174" width="162" height="30" rx="4" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1" stroke-dasharray="3 2"/><text x="273" y="193" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#F2F2F2">trying again...</text></g></g>

  <!-- Terminal Assistance Output -->
  <rect x="16" y="226" width="348" height="102" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>
