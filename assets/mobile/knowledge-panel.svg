<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 424" width="380" height="424" role="img" aria-label="Knowledge Base">
  <title>Knowledge Base (Mobile)</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .zip-bar { animation: zipLoad 8s ease-in-out infinite; }
    @keyframes zipLoad { 0%, 10% { width: 24px; } 55%, 88% { width: 312px; } 96%, 100% { width: 24px; } }
    .zip-step2 { animation: zStep2 8s linear infinite; }
    @keyframes zStep2 { 0%, 40% { opacity: 0.25; } 50%, 90% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
  </style>

  <rect x="0" y="0" width="380" height="424" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="378" height="422" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <rect x="1.5" y="1.5" width="377" height="34" rx="6" fill="#080808"/>
  <line x1="1" y1="36" x2="379" y2="36" stroke="#303030" stroke-width="1"/>
  <text x="16" y="23" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">Knowledge Base</text>
  <text x="364" y="23" text-anchor="end" class="mono" font-size="12" fill="#6E6E6E">~/knowledge-base/</text>

  <g transform="translate(16, 50)"><rect x="0" y="0" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.1"/><rect x="14" y="11" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><text x="36" y="21" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">learning-notes/</text><text x="14" y="41" class="sans" font-size="13" fill="#A6A6A6">notes on Android input, Python &amp; Git basics</text></g><g transform="translate(16, 108)"><rect x="0" y="0" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.1"/><rect x="14" y="11" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><text x="36" y="21" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">experiments/</text><text x="14" y="41" class="sans" font-size="13" fill="#A6A6A6">small layout tests &amp; terminal SVG sandboxes</text></g><g transform="translate(16, 166)"><rect x="0" y="0" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.1"/><rect x="14" y="11" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><text x="36" y="21" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">project-references/</text><text x="14" y="41" class="sans" font-size="13" fill="#A6A6A6">Gnosis Keyboard data structures &amp; references</text></g><g transform="translate(16, 224)"><rect x="0" y="0" width="348" height="50" rx="6" fill="#080808" stroke="#303030" stroke-width="1.1"/><rect x="14" y="11" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><text x="36" y="21" class="mono" font-size="14" font-weight="700" fill="#F2F2F2">ideas/</text><text x="14" y="41" class="sans" font-size="13" fill="#A6A6A6">future tools to build after catching up on sleep</text></g>

  <!-- Bottom Archive Extraction Card -->
  <rect x="16" y="288" width="348" height="120" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>
  <g transform="translate(32, 302)">
    <rect x="0" y="0" width="28" height="34" rx="3" fill="#0D0D0D" stroke="#F2F2F2" stroke-width="1.2"/>
    <line x1="14" y1="2" x2="14" y2="22" stroke="#A6A6A6" stroke-width="3" stroke-dasharray="2 2"/>
    <rect x="10" y="22" width="8" height="6" fill="#F2F2F2"/>
  </g>
  <text x="72" y="317" class="mono" font-size="14.5" font-weight="700" fill="#F2F2F2">notes-archive.zip</text>
  <text x="72" y="334" class="mono" font-size="12" fill="#6E6E6E">[concept preview]</text>

  <rect x="32" y="348" width="316" height="11" rx="3.5" fill="#000000" stroke="#303030" stroke-width="1"/>
  <rect x="32" y="348" width="260" height="11" rx="3.5" fill="#F2F2F2" class="zip-bar"/>

  <text x="32" y="382" class="mono" font-size="13" fill="#A6A6A6">&gt; extracting knowledge...</text>
  <text x="32" y="400" class="mono zip-step2" font-size="13" font-weight="700" fill="#F2F2F2">&gt; still learning...</text>
</svg>
