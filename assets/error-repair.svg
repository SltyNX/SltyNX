<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 275" width="880" height="275" role="img" aria-label="Simulated Error Animation — The AI Construction Truck">
  <title>Error Animation — The AI Construction Truck (Simulated)</title>
  <defs>
    <clipPath id="truckLaneClip">
      <rect x="432" y="42" width="434" height="222" rx="6"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }

    /* 14s deterministic error and construction truck repair loop */
    .err-line { animation: showErr 14s linear infinite; }
    @keyframes showErr {
      0%, 4% { opacity: 0; }
      6%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .req-line { animation: showReq 14s linear infinite; }
    @keyframes showReq {
      0%, 16% { opacity: 0; }
      20%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .fix-line { animation: showFix 14s linear infinite; }
    @keyframes fixLine {
      0%, 46% { opacity: 0; }
      50%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes showFix {
      0%, 46% { opacity: 0; }
      50%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .ok-line { animation: showOk 14s linear infinite; }
    @keyframes showOk {
      0%, 68% { opacity: 0; }
      72%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .prog-fill { animation: progBar 14s ease-in-out infinite; }
    @keyframes progBar {
      0%, 46% { width: 0px; fill: #6E6E6E; }
      68% { width: 220px; fill: #F2F2F2; }
      72%, 92% { width: 220px; fill: #4ADE80; }
      97%, 100% { width: 0px; }
    }

    /* Truck drives in from right (x=320 offset -> x=0 stop -> exits left) */
    .truck-rig { animation: truckDrive 14s ease-in-out infinite; }
    @keyframes truckDrive {
      0%, 20% { transform: translateX(280px); opacity: 0; }
      24% { opacity: 1; }
      36%, 74% { transform: translateX(0px); opacity: 1; }
      88% { transform: translateX(-290px); opacity: 1; }
      92%, 100% { transform: translateX(-310px); opacity: 0; }
    }

    /* Worker and wrench repair action while truck is parked (38% - 68%) */
    .worker-fix { animation: workerAct 14s linear infinite; }
    @keyframes workerAct {
      0%, 36% { opacity: 0; }
      40%, 68% { opacity: 1; }
      72%, 100% { opacity: 0; }
    }

    .wrench-turn { animation: wrenchRot 0.8s ease-in-out infinite; transform-origin: 572px 192px; }
    @keyframes wrenchRot {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }

    .warn-badge { animation: warnState 14s linear infinite; }
    @keyframes warnState {
      0%, 5% { opacity: 0; }
      8%, 68% { opacity: 1; }
      72%, 100% { opacity: 0; }
    }

    .fixed-badge { animation: showOk 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .err-line, .req-line, .fix-line, .ok-line, .fixed-badge { animation: none !important; opacity: 1 !important; }
      .warn-badge { display: none !important; }
      .prog-fill { animation: none !important; width: 220px !important; fill: #4ADE80 !important; }
      .truck-rig { animation: none !important; transform: translateX(0px) !important; opacity: 1 !important; }
      .worker-fix { animation: none !important; opacity: 1 !important; }
      .wrench-turn { animation: none !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="275" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="878" height="273" rx="7" fill="none" stroke="#303030" stroke-width="1"/>

  <!-- Top Terminal Header -->
  <rect x="1.5" y="1.5" width="877" height="32" rx="6" fill="#080808"/>
  <line x1="1" y1="34" x2="879" y2="34" stroke="#303030" stroke-width="1"/>
  <text x="24" y="22" class="mono" font-size="12.5" font-weight="700" fill="#F2F2F2">// Simulated Error &amp; Repair</text>
  <text x="856" y="22" text-anchor="end" class="mono" font-size="10.5" fill="#6E6E6E">[simulated sequence]</text>

  <!-- =================================================================== -->
  <!-- LEFT SIDE (24..412): Simulated Terminal Output & Progress Bar       -->
  <!-- =================================================================== -->
  <text x="28" y="68" class="mono err-line" font-size="13.5" font-weight="600" fill="#F87171">! error: something went wrong</text>
  <text x="28" y="98" class="mono err-line" font-size="13" fill="#A6A6A6">&gt; diagnosis: developer confusion</text>
  <text x="28" y="128" class="mono req-line" font-size="13" fill="#A6A6A6">&gt; requesting assistance...</text>
  <text x="28" y="158" class="mono fix-line" font-size="13" fill="#F2F2F2">&gt; applying fix...</text>

  <!-- Simulated Repair Progress Bar -->
  <g class="fix-line">
    <rect x="28" y="174" width="220" height="12" rx="3" fill="#080808" stroke="#303030" stroke-width="1"/>
    <rect x="28" y="174" width="220" height="12" rx="3" fill="#4ADE80" class="prog-fill"/>
    <text x="258" y="184" class="mono" font-size="11" fill="#6E6E6E">repair_job</text>
  </g>

  <!-- Restrained Simulated Success Line -->
  <text x="28" y="218" class="mono ok-line" font-size="13.5" font-weight="600" fill="#4ADE80">&#10003; build successful (in this simulation)</text>
  <text x="28" y="248" class="mono" font-size="10.5" fill="#6E6E6E">// demonstration only &#8212; no real build harmed</text>

  <!-- Vertical Separator -->
  <line x1="420" y1="34" x2="420" y2="274" stroke="#303030" stroke-width="1"/>

  <!-- =================================================================== -->
  <!-- RIGHT SIDE (432..866): Puzzled Mascot + Pixel AI Construction Truck -->
  <!-- =================================================================== -->
  <rect x="432" y="42" width="434" height="220" rx="6" fill="#080808" stroke="#303030" stroke-width="1"/>

  <g clip-path="url(#truckLaneClip)">
    <!-- Top Section inside Right Panel: Puzzled Mascot + Error Module Box -->
    <!-- Small Puzzled Mascot Avatar -->
    <g transform="translate(480, 96)">
      <circle cx="0" cy="0" r="20" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
      <path d="M -20 0 C -20 -26, 20 -26, 20 0 C 14 -10, 4 -8, -2 -4 L -8 -12 L -14 -4 Z" fill="#1A1A1A"/>
      <line x1="-9" y1="2" x2="-3" y2="2" stroke="#000000" stroke-width="2"/>
      <line x1="3" y1="2" x2="9" y2="2" stroke="#000000" stroke-width="2"/>
      <text x="24" y="-8" class="mono warn-badge" font-size="13" font-weight="700" fill="#A6A6A6">?</text>
    </g>

    <!-- Error / Build Module Box on Work Track -->
    <g class="warn-badge">
      <rect x="520" y="138" width="66" height="42" rx="4" fill="#140C0C" stroke="#F87171" stroke-width="1.3"/>
      <polygon points="553,146 543,164 563,164" fill="none" stroke="#FBBF24" stroke-width="1.4"/>
      <text x="553" y="162" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FBBF24">!</text>
      <text x="553" y="175" text-anchor="middle" class="mono" font-size="8.5" fill="#F87171">ERR_01</text>
    </g>

    <!-- Fixed Module State -->
    <g class="fixed-badge">
      <rect x="520" y="138" width="66" height="42" rx="4" fill="#0B140E" stroke="#4ADE80" stroke-width="1.3"/>
      <text x="553" y="160" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#4ADE80">&#10003;</text>
      <text x="553" y="174" text-anchor="middle" class="mono" font-size="8.5" fill="#4ADE80">FIXED</text>
    </g>

    <!-- Miniature Pixel Worker + Toolbox + Wrench Inspecting the Problem -->
    <g class="worker-fix">
      <!-- Red/Grey Pixel Toolbox -->
      <rect x="588" y="198" width="18" height="12" rx="1" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1"/>
      <line x1="592" y1="198" x2="602" y2="198" stroke="#F2F2F2" stroke-width="2"/>
      <!-- Worker body -->
      <rect x="570" y="190" width="12" height="18" rx="2" fill="#2A2A2A" stroke="#A6A6A6" stroke-width="1"/>
      <!-- Worker head & safety hard-hat -->
      <circle cx="576" cy="183" r="6" fill="#E5E5E5"/>
      <path d="M 568 182 C 568 175, 584 175, 584 182 Z" fill="#FBBF24"/>
      <!-- Animated Wrench & Sparks -->
      <g class="wrench-turn">
        <line x1="572" y1="192" x2="560" y2="176" stroke="#F2F2F2" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="559" cy="175" r="3" fill="none" stroke="#F2F2F2" stroke-width="1.5"/>
      </g>
      <text x="562" y="168" class="mono" font-size="10" fill="#FBBF24">*</text>
      <text x="576" y="166" class="mono" font-size="9" fill="#F2F2F2">+</text>
    </g>

    <!-- Pixel-Art AI Construction Truck on Dedicated Track -->
    <g class="truck-rig">
      <!-- Cargo Signboard: [ AI ASSIST ] -->
      <rect x="652" y="148" width="114" height="32" rx="3" fill="#000000" stroke="#FBBF24" stroke-width="1.3"/>
      <text x="709" y="168" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#F2F2F2">[ AI ASSIST ]</text>

      <!-- Truck Bed / Chassis -->
      <rect x="646" y="180" width="124" height="24" rx="2" fill="#1C1C1C" stroke="#A6A6A6" stroke-width="1.2"/>
      <!-- Hazard stripes on bumper -->
      <line x1="654" y1="186" x2="660" y2="198" stroke="#FBBF24" stroke-width="2"/>
      <line x1="666" y1="186" x2="672" y2="198" stroke="#FBBF24" stroke-width="2"/>
      <line x1="678" y1="186" x2="684" y2="198" stroke="#FBBF24" stroke-width="2"/>

      <!-- Truck Cab (Facing Left toward the error module) -->
      <polygon points="614,182 626,162 646,162 646,204 614,204" fill="#262626" stroke="#F2F2F2" stroke-width="1.2"/>
      <!-- Cab Window -->
      <polygon points="619,180 628,166 642,166 642,180" fill="#090909" stroke="#303030" stroke-width="1"/>
      <!-- Amber Roof Beacon -->
      <rect x="631" y="156" width="8" height="5" rx="1.5" fill="#FBBF24"/>

      <!-- Wheels -->
      <circle cx="632" cy="206" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
      <circle cx="632" cy="206" r="3" fill="#F2F2F2"/>
      <circle cx="682" cy="206" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
      <circle cx="682" cy="206" r="3" fill="#F2F2F2"/>
      <circle cx="744" cy="206" r="9" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2"/>
      <circle cx="744" cy="206" r="3" fill="#F2F2F2"/>
    </g>

    <!-- Dedicated Ground Track Line -->
    <line x1="444" y1="216" x2="854" y2="216" stroke="#303030" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="649" y="244" text-anchor="middle" class="mono" font-size="10.5" fill="#6E6E6E">lane: emergency_patch_unit.exe</text>
  </g>
</svg>
