<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" width="640" height="436" role="img" aria-label="Simulated Error Animation — The AI Construction Truck">
  <title>Error Animation — The AI Construction Truck (Simulated)</title>
  <defs>
    <clipPath id="truckLaneClip">
      <rect x="20" y="246" width="600" height="174" rx="6"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }

    .err-line { animation: showErr 14s linear infinite; }
    @keyframes showErr {
      0%, 4% { opacity: 0; }
      6%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .req-line { animation: showReq 14s linear infinite; }
    @keyframes showReq {
      0%, 16% { opacity: 0; }
      20%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .fix-line { animation: showFix 14s linear infinite; }
    @keyframes showFix {
      0%, 46% { opacity: 0; }
      50%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .ok-line { animation: showOk 14s linear infinite; }
    @keyframes showOk {
      0%, 68% { opacity: 0; }
      72%, 92% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }

    .prog-fill { animation: progBar 14s ease-in-out infinite; }
    @keyframes progBar {
      0%, 46% { width: 0px; fill: #6E6E6E; }
      68% { width: 320px; fill: #F2F2F2; }
      72%, 92% { width: 320px; fill: #4ADE80; }
      97%, 100% { width: 0px; }
    }

    .truck-rig { animation: truckDrive 14s ease-in-out infinite; }
    @keyframes truckDrive {
      0%, 20% { transform: translateX(320px); opacity: 0; }
      24% { opacity: 1; }
      36%, 74% { transform: translateX(0px); opacity: 1; }
      88% { transform: translateX(-340px); opacity: 1; }
      92%, 100% { transform: translateX(-360px); opacity: 0; }
    }

    .worker-fix { animation: workerAct 14s linear infinite; }
    @keyframes workerAct {
      0%, 36% { opacity: 0; }
      40%, 68% { opacity: 1; }
      72%, 100% { opacity: 0; }
    }

    .wrench-turn { animation: wrenchRot 0.8s ease-in-out infinite; transform-origin: 282px 352px; }
    @keyframes wrenchRot {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }

    .warn-badge { animation: warnState 14s linear infinite; }
    @keyframes warnState {
      0%, 5% { opacity: 0; }
      8%, 68% { opacity: 1; }
      72%, 100% { opacity: 0; }
    }

    .fixed-badge { animation: showOk 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .err-line, .req-line, .fix-line, .ok-line, .fixed-badge { animation: none !important; opacity: 1 !important; }
      .warn-badge { display: none !important; }
      .prog-fill { animation: none !important; width: 320px !important; fill: #4ADE80 !important; }
      .truck-rig { animation: none !important; transform: translateX(0px) !important; opacity: 1 !important; }
      .worker-fix { animation: none !important; opacity: 1 !important; }
      .wrench-turn { animation: none !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="640" height="436" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="638" height="434" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <!-- Top Terminal Header -->
  <rect x="1.5" y="1.5" width="637" height="36" rx="6" fill="#080808"/>
  <line x1="1" y1="38" x2="639" y2="38" stroke="#303030" stroke-width="1"/>
  <circle cx="22" cy="19.5" r="4.5" fill="#383838"/>
  <circle cx="38" cy="19.5" r="4.5" fill="#383838"/>
  <circle cx="54" cy="19.5" r="4.5" fill="#383838"/>
  <text x="74" y="24" class="mono" font-size="13.5" fill="#A6A6A6">sltynx@desk: ~/debug-sim (error &amp; repair)</text>
  <text x="620" y="24" text-anchor="end" class="mono" font-size="12.5" fill="#6E6E6E">[simulated]</text>

  <!-- TOP SECTION: Simulated Terminal Output & Progress Bar -->
  <text x="26" y="68" class="mono err-line" font-size="16" font-weight="700" fill="#F87171">! error: something went wrong</text>
  <text x="26" y="98" class="mono err-line" font-size="15.5" fill="#A6A6A6">&gt; diagnosis: developer confusion</text>
  <text x="26" y="128" class="mono req-line" font-size="15.5" fill="#A6A6A6">&gt; requesting assistance...</text>
  <text x="26" y="158" class="mono fix-line" font-size="15.5" fill="#F2F2F2">&gt; applying fix...</text>

  <g class="fix-line">
    <rect x="26" y="172" width="320" height="14" rx="4" fill="#080808" stroke="#303030" stroke-width="1.1"/>
    <rect x="26" y="172" width="320" height="14" rx="4" fill="#4ADE80" class="prog-fill"/>
    <text x="358" y="184" class="mono" font-size="13" fill="#6E6E6E">repair_job</text>
  </g>

  <text x="26" y="216" class="mono ok-line" font-size="16" font-weight="700" fill="#4ADE80">&#10003; build successful (in this simulation)</text>

  <!-- Horizontal Separator -->
  <line x1="20" y1="234" x2="620" y2="234" stroke="#303030" stroke-width="1"/>

  <!-- BOTTOM SECTION: Puzzled Mascot + Pixel AI Construction Truck -->
  <rect x="20" y="246" width="600" height="174" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>

  <g clip-path="url(#truckLaneClip)">
    <!-- Puzzled Mascot Avatar on Left of Track -->
    <g transform="translate(92, 316)">
      <circle cx="0" cy="0" r="24" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
      <path d="M -24 0 C -24 -30, 24 -30, 24 0 C 17 -12, 5 -10, -2 -4 L -9 -14 L -16 -4 Z" fill="#1A1A1A"/>
      <line x1="-11" y1="2" x2="-4" y2="2" stroke="#000000" stroke-width="2.2"/>
      <line x1="4" y1="2" x2="11" y2="2" stroke="#000000" stroke-width="2.2"/>
      <text x="28" y="-8" class="mono warn-badge" font-size="16" font-weight="700" fill="#A6A6A6">?</text>
    </g>

    <!-- Error / Build Module Box on Work Track -->
    <g class="warn-badge">
      <rect x="196" y="302" width="76" height="48" rx="5" fill="#140C0C" stroke="#F87171" stroke-width="1.4"/>
      <polygon points="234,310 222,330 246,330" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
      <text x="234" y="328" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FBBF24">!</text>
      <text x="234" y="344" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#F87171">ERR_01</text>
    </g>

    <!-- Fixed Module State -->
    <g class="fixed-badge">
      <rect x="196" y="302" width="76" height="48" rx="5" fill="#0B140E" stroke="#4ADE80" stroke-width="1.4"/>
      <text x="234" y="327" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#4ADE80">&#10003;</text>
      <text x="234" y="343" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#4ADE80">FIXED</text>
    </g>

    <!-- Miniature Pixel Worker + Toolbox + Wrench -->
    <g class="worker-fix">
      <rect x="302" y="358" width="20" height="14" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/>
      <line x1="306" y1="358" x2="318" y2="358" stroke="#F2F2F2" stroke-width="2"/>
      <rect x="280" y="350" width="14" height="20" rx="2" fill="#2A2A2A" stroke="#A6A6A6" stroke-width="1.1"/>
      <circle cx="287" cy="342" r="7" fill="#E5E5E5"/>
      <path d="M 278 341 C 278 333, 296 333, 296 341 Z" fill="#FBBF24"/>
      <g class="wrench-turn">
        <line x1="282" y1="352" x2="268" y2="334" stroke="#F2F2F2" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="267" cy="333" r="3.5" fill="none" stroke="#F2F2F2" stroke-width="1.6"/>
      </g>
      <text x="270" y="326" class="mono" font-size="12" fill="#FBBF24">*</text>
      <text x="286" y="324" class="mono" font-size="11" fill="#F2F2F2">+</text>
    </g>

    <!-- Pixel-Art AI Construction Truck on Dedicated Track -->
    <g class="truck-rig">
      <rect x="376" y="302" width="136" height="36" rx="4" fill="#000000" stroke="#FBBF24" stroke-width="1.4"/>
      <text x="444" y="325" text-anchor="middle" class="mono" font-size="13.5" font-weight="700" fill="#F2F2F2">[ AI ASSIST ]</text>

      <rect x="368" y="338" width="146" height="26" rx="2.5" fill="#1C1C1C" stroke="#A6A6A6" stroke-width="1.3"/>
      <line x1="378" y1="344" x2="384" y2="358" stroke="#FBBF24" stroke-width="2.2"/>
      <line x1="392" y1="344" x2="398" y2="358" stroke="#FBBF24" stroke-width="2.2"/>
      <line x1="406" y1="344" x2="412" y2="358" stroke="#FBBF24" stroke-width="2.2"/>

      <polygon points="332,340 346,318 368,318 368,364 332,364" fill="#262626" stroke="#F2F2F2" stroke-width="1.3"/>
      <polygon points="338,338 348,322 364,322 364,338" fill="#090909" stroke="#303030" stroke-width="1"/>
      <rect x="351" y="311" width="9" height="6" rx="1.5" fill="#FBBF24"/>

      <circle cx="352" cy="366" r="10" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2.2"/>
      <circle cx="352" cy="366" r="3.5" fill="#F2F2F2"/>
      <circle cx="410" cy="366" r="10" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2.2"/>
      <circle cx="410" cy="366" r="3.5" fill="#F2F2F2"/>
      <circle cx="482" cy="366" r="10" fill="#0A0A0A" stroke="#A6A6A6" stroke-width="2.2"/>
      <circle cx="482" cy="366" r="3.5" fill="#F2F2F2"/>
    </g>

    <!-- Dedicated Ground Track Line -->
    <line x1="36" y1="377" x2="604" y2="377" stroke="#303030" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="320" y="402" text-anchor="middle" class="mono" font-size="13" fill="#6E6E6E">lane: emergency_patch_unit.exe // demonstration only</text>
  </g>
</svg>
