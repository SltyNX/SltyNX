<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Animated Terminal Session — Scene A and Scene B: Running Out of Ideas">
  <title>Terminal Session — A Developer Running Out of Ideas (Scenes A &amp; B)</title>
  <defs>
    <clipPath id="tsClip0"><rect x="24" y="60" width="460" height="26" class="tline0"/></clipPath><clipPath id="tsClip1"><rect x="24" y="94" width="460" height="26" class="tline1"/></clipPath><clipPath id="tsClip2"><rect x="24" y="128" width="460" height="26" class="tline2"/></clipPath><clipPath id="tsClip3"><rect x="24" y="162" width="460" height="26" class="tline3"/></clipPath><clipPath id="tsClip4"><rect x="24" y="196" width="460" height="26" class="tline4"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .tline0 { animation: typeL0 12s steps(28, end) infinite; }
    @keyframes typeL0 {
      0%, 3.5% { width: 0px; }
      14.0%, 92% { width: 460px; }
      97%, 100% { width: 0px; }
    }    .tline1 { animation: typeL1 12s steps(28, end) infinite; }
    @keyframes typeL1 {
      0%, 17.5% { width: 0px; }
      28.0%, 92% { width: 460px; }
      97%, 100% { width: 0px; }
    }    .tline2 { animation: typeL2 12s steps(28, end) infinite; }
    @keyframes typeL2 {
      0%, 32.5% { width: 0px; }
      44.0%, 92% { width: 460px; }
      97%, 100% { width: 0px; }
    }    .tline3 { animation: typeL3 12s steps(28, end) infinite; }
    @keyframes typeL3 {
      0%, 48.5% { width: 0px; }
      58.0%, 92% { width: 460px; }
      97%, 100% { width: 0px; }
    }    .tline4 { animation: typeL4 12s steps(28, end) infinite; }
    @keyframes typeL4 {
      0%, 62.5% { width: 0px; }
      75.0%, 92% { width: 460px; }
      97%, 100% { width: 0px; }
    }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .thought-bubble { animation: bubbleShow 12s ease-in-out infinite; }
    @keyframes bubbleShow {
      0%, 52% { opacity: 0; transform: translateY(4px); }
      58%, 90% { opacity: 1; transform: translateY(0px); }
      96%, 100% { opacity: 0; transform: translateY(4px); }
    }

    .mascot-nod { animation: mNod 6s ease-in-out infinite; transform-origin: 684px 175px; }
    @keyframes mNod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tline0, .tline1, .tline2, .tline3, .tline4 { animation: none !important; width: 460px !important; }
      .thought-bubble { animation: none !important; opacity: 1 !important; }
      .mascot-nod, .cur { animation: none !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="280" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="878" height="278" rx="7" fill="none" stroke="#303030" stroke-width="1"/>

  <!-- Top Terminal Bar -->
  <rect x="1.5" y="1.5" width="877" height="32" rx="6" fill="#080808"/>
  <line x1="1" y1="34" x2="879" y2="34" stroke="#303030" stroke-width="1"/>
  <text x="24" y="22" class="mono" font-size="12.5" font-weight="700" fill="#F2F2F2">// Development Log &amp; Story</text>
  <text x="856" y="22" text-anchor="end" class="mono" font-size="11" fill="#6E6E6E">scene 01 // running out of ideas</text>

  <!-- =================================================================== -->
  <!-- SCENE A (LEFT): Terminal Typing Sequence                            -->
  <!-- =================================================================== -->
  <text x="28" y="78" clip-path="url(#tsClip0)" class="mono" font-size="13.5" fill="#F2F2F2">$ start-project</text><text x="28" y="112" clip-path="url(#tsClip1)" class="mono" font-size="13.5" fill="#A6A6A6">&gt; opening the editor...</text><text x="28" y="146" clip-path="url(#tsClip2)" class="mono" font-size="13.5" fill="#A6A6A6">&gt; thinking of an idea...</text><text x="28" y="180" clip-path="url(#tsClip3)" class="mono" font-size="13.5" fill="#F87171">&gt; no ideas found.</text><text x="28" y="214" clip-path="url(#tsClip4)" class="mono" font-size="13.5" fill="#A6A6A6">&gt; searching for motivation...</text>

  <!-- Blinking Terminal Cursor on bottom prompt line -->
  <text x="28" y="246" class="mono" font-size="13.5" fill="#6E6E6E">$ </text>
  <rect x="44" y="233" width="8" height="15" fill="#F2F2F2" class="cur"/>

  <!-- Vertical Divider -->
  <line x1="516" y1="34" x2="516" y2="279" stroke="#303030" stroke-width="1"/>

  <!-- =================================================================== -->
  <!-- SCENE B (RIGHT): Sleepy Mascot at Laptop + "...what now?" Bubble    -->
  <!-- =================================================================== -->
  <rect x="536" y="48" width="324" height="214" rx="6" fill="#080808" stroke="#303030" stroke-width="1"/>

  <!-- Desk Surface -->
  <line x1="548" y1="224" x2="848" y2="224" stroke="#303030" stroke-width="1.5"/>

  <!-- Coffee Mug on Desk -->
  <rect x="572" y="206" width="16" height="18" rx="2" fill="#0D0D0D" stroke="#6E6E6E" stroke-width="1.2"/>
  <path d="M 588 210 C 593 210, 593 220, 588 220" fill="none" stroke="#6E6E6E" stroke-width="1.2"/>

  <!-- Sleepy Mascot Sitting Behind Laptop -->
  <g class="mascot-nod">
    <!-- Torso -->
    <rect x="658" y="182" width="48" height="42" rx="8" fill="#222222" stroke="#A6A6A6" stroke-width="1.2"/>
    <!-- Chibi Head & Dark Bangs -->
    <circle cx="682" cy="152" r="26" fill="#E5E5E5" stroke="#303030" stroke-width="1.2"/>
    <path d="M 655 152 C 655 118, 709 118, 709 152 C 703 138, 692 142, 684 148 L 678 138 L 670 148 L 662 140 Z" fill="#1A1A1A" stroke="#6E6E6E" stroke-width="1.1"/>
    <!-- Sleepy / Blank Expression Eyes Looking at Screen -->
    <line x1="670" y1="156" x2="678" y2="156" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="686" y1="156" x2="694" y2="156" stroke="#000000" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Small sweat drop -->
    <path d="M 702 146 Q 705 152 702 154 Q 699 152 702 146 Z" fill="#A6A6A6"/>
  </g>

  <!-- Laptop on Desk in Front of Mascot -->
  <polygon points="622,186 676,186 684,222 630,222" fill="#141414" stroke="#A6A6A6" stroke-width="1.3"/>
  <!-- Glowing Apple/Logo dot on laptop lid -->
  <polygon points="653,200 649,207 657,207" fill="#F2F2F2"/>
  <!-- Laptop Base -->
  <rect x="626" y="220" width="76" height="4" rx="1.5" fill="#A6A6A6"/>

  <!-- Thought Bubble: "...what now?" -->
  <g class="thought-bubble">
    <circle cx="716" cy="122" r="3" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1"/>
    <circle cx="726" cy="110" r="4.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1"/>
    <rect x="724" y="66" width="122" height="34" rx="6" fill="#000000" stroke="#A6A6A6" stroke-width="1.2"/>
    <text x="785" y="88" text-anchor="middle" class="mono" font-size="12.5" fill="#F2F2F2">...what now?</text>
  </g>

  <text x="698" y="248" text-anchor="middle" class="mono" font-size="10.5" fill="#6E6E6E">status: staring at blank editor</text>
</svg>
