<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Knowledge Base — Notes, experiments, and things I am learning">
  <title>Knowledge Base — Notes, experiments, and things I&#x27;m learning.</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .zip-bar { animation: zipLoad 8s ease-in-out infinite; }
    @keyframes zipLoad {
      0%, 10% { width: 24px; }
      55%, 88% { width: 320px; }
      96%, 100% { width: 24px; }
    }
    .zip-step2 { animation: zStep2 8s linear infinite; }
    @keyframes zStep2 {
      0%, 40% { opacity: 0.25; }
      50%, 90% { opacity: 1; }
      96%, 100% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .zip-bar { animation: none !important; width: 280px !important; }
      .zip-step2 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="640" height="360" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="638" height="358" rx="7" fill="none" stroke="#303030" stroke-width="1.2"/>

  <!-- Header Strip -->
  <rect x="1.5" y="1.5" width="637" height="36" rx="6" fill="#080808"/>
  <line x1="1" y1="38" x2="639" y2="38" stroke="#303030" stroke-width="1"/>
  <text x="20" y="25" class="mono" font-size="14.5" font-weight="700" fill="#F2F2F2">Knowledge Base</text>
  <text x="164" y="25" class="sans" font-size="14" fill="#A6A6A6">&#8212; Notes, experiments, and things I&#x27;m learning.</text>

  <!-- Top Explorer Tree -->
  <text x="24" y="64" class="mono" font-size="13.5" fill="#6E6E6E">~/knowledge-base/</text>
  <g transform="translate(24, 94)"><rect x="0" y="-14" width="16" height="13" rx="2" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.2"/><path d="M 0 -12 H 7 L 9 -14 H 0 Z" fill="#A6A6A6"/><text x="26" y="-2" class="mono" font-size="15" font-weight="700" fill="#F2F2F2">learning-notes/</text><text x="218" y="-2" class="sans" font-size="14" fill="#A6A6A6">// notes on Android input, Python &amp; Git basics</text></g><g transform="translate(24, 126)"><rect x="0" y="-14" width="16" height="13" rx="2" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.2"/><path d="M 0 -12 H 7 L 9 -14 H 0 Z" fill="#A6A6A6"/><text x="26" y="-2" class="mono" font-size="15" font-weight="700" fill="#F2F2F2">experiments/</text><text x="218" y="-2" class="sans" font-size="14" fill="#A6A6A6">// small layout tests &amp; terminal SVG sandboxes</text></g><g transform="translate(24, 158)"><rect x="0" y="-14" width="16" height="13" rx="2" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.2"/><path d="M 0 -12 H 7 L 9 -14 H 0 Z" fill="#A6A6A6"/><text x="26" y="-2" class="mono" font-size="15" font-weight="700" fill="#F2F2F2">project-references/</text><text x="218" y="-2" class="sans" font-size="14" fill="#A6A6A6">// Gnosis Keyboard data structures &amp; references</text></g><g transform="translate(24, 190)"><rect x="0" y="-14" width="16" height="13" rx="2" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.2"/><path d="M 0 -12 H 7 L 9 -14 H 0 Z" fill="#A6A6A6"/><text x="26" y="-2" class="mono" font-size="15" font-weight="700" fill="#F2F2F2">ideas/</text><text x="218" y="-2" class="sans" font-size="14" fill="#A6A6A6">// future tools to build after catching up on sleep</text></g>

  <!-- Bottom Archive Extraction Visual Concept -->
  <rect x="20" y="222" width="600" height="120" rx="6" fill="#080808" stroke="#303030" stroke-width="1.2"/>

  <!-- Pixel ZIP Archive Icon -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="32" height="38" rx="3.5" fill="#0D0D0D" stroke="#F2F2F2" stroke-width="1.3"/>
    <line x1="16" y1="2" x2="16" y2="24" stroke="#A6A6A6" stroke-width="3.2" stroke-dasharray="2.5 2.5"/>
    <rect x="11" y="24" width="10" height="7" fill="#F2F2F2"/>
  </g>
  <text x="86" y="257" class="mono" font-size="15" font-weight="700" fill="#F2F2F2">notes-archive.zip</text>
  <text x="86" y="276" class="mono" font-size="12.5" fill="#6E6E6E">[concept preview]</text>

  <!-- Loading Indicator -->
  <rect x="256" y="246" width="340" height="12" rx="4" fill="#000000" stroke="#303030" stroke-width="1.1"/>
  <rect x="256" y="246" width="280" height="12" rx="4" fill="#F2F2F2" class="zip-bar"/>

  <!-- Extraction Status Lines -->
  <text x="40" y="306" class="mono" font-size="14.5" fill="#A6A6A6">&gt; extracting knowledge...</text>
  <text x="310" y="306" class="mono zip-step2" font-size="14.5" font-weight="600" fill="#F2F2F2">&gt; still learning...</text>
</svg>
