<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Knowledge Base — Notes, experiments, and things I am learning">
  <title>Knowledge Base — Notes, experiments, and things I&#x27;m learning.</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .zip-bar { animation: zipLoad 8s ease-in-out infinite; }
    @keyframes zipLoad {
      0%, 10% { width: 18px; }
      55%, 88% { width: 224px; }
      96%, 100% { width: 18px; }
    }
    .zip-step2 { animation: zStep2 8s linear infinite; }
    @keyframes zStep2 {
      0%, 40% { opacity: 0.25; }
      50%, 90% { opacity: 1; }
      96%, 100% { opacity: 0.25; }
    }
    @media (prefers-reduced-motion: reduce) {
      .zip-bar { animation: none !important; width: 180px !important; }
      .zip-step2 { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="880" height="220" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="878" height="218" rx="7" fill="none" stroke="#303030" stroke-width="1"/>

  <!-- Header Strip -->
  <rect x="1.5" y="1.5" width="877" height="32" rx="6" fill="#080808"/>
  <line x1="1" y1="34" x2="879" y2="34" stroke="#303030" stroke-width="1"/>
  <text x="24" y="22" class="mono" font-size="12.5" font-weight="700" fill="#F2F2F2">// Knowledge Base</text>
  <text x="164" y="22" class="sans" font-size="12" fill="#A6A6A6">&#8212; Notes, experiments, and things I&#x27;m learning.</text>

  <!-- Left Explorer Tree -->
  <text x="28" y="56" class="mono" font-size="11.5" fill="#6E6E6E">~/knowledge-base/</text>
  <g transform="translate(28, 86)"><rect x="0" y="-12" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><path d="M 0 -10 H 6 L 8 -12 H 0 Z" fill="#A6A6A6"/><text x="22" y="-2" class="mono" font-size="12.5" font-weight="600" fill="#F2F2F2">learning-notes/</text><text x="186" y="-2" class="sans" font-size="12" fill="#A6A6A6">// notes on Android input, Python &amp; Git basics</text></g><g transform="translate(28, 116)"><rect x="0" y="-12" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><path d="M 0 -10 H 6 L 8 -12 H 0 Z" fill="#A6A6A6"/><text x="22" y="-2" class="mono" font-size="12.5" font-weight="600" fill="#F2F2F2">experiments/</text><text x="186" y="-2" class="sans" font-size="12" fill="#A6A6A6">// small layout tests &amp; terminal SVG sandboxes</text></g><g transform="translate(28, 146)"><rect x="0" y="-12" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><path d="M 0 -10 H 6 L 8 -12 H 0 Z" fill="#A6A6A6"/><text x="22" y="-2" class="mono" font-size="12.5" font-weight="600" fill="#F2F2F2">project-references/</text><text x="186" y="-2" class="sans" font-size="12" fill="#A6A6A6">// Gnosis Keyboard data structures &amp; references</text></g><g transform="translate(28, 176)"><rect x="0" y="-12" width="14" height="11" rx="1.5" fill="#0D0D0D" stroke="#A6A6A6" stroke-width="1.1"/><path d="M 0 -10 H 6 L 8 -12 H 0 Z" fill="#A6A6A6"/><text x="22" y="-2" class="mono" font-size="12.5" font-weight="600" fill="#F2F2F2">ideas/</text><text x="186" y="-2" class="sans" font-size="12" fill="#A6A6A6">// future tools to build after catching up on sleep</text></g>

  <!-- Vertical Separator -->
  <line x1="556" y1="34" x2="556" y2="219" stroke="#303030" stroke-width="1"/>

  <!-- Right Side: Archive Extraction Visual Concept -->
  <rect x="576" y="48" width="280" height="154" rx="6" fill="#080808" stroke="#303030" stroke-width="1"/>

  <!-- Pixel ZIP Archive Icon -->
  <g transform="translate(596, 64)">
    <rect x="0" y="0" width="28" height="34" rx="3" fill="#0D0D0D" stroke="#F2F2F2" stroke-width="1.2"/>
    <line x1="14" y1="2" x2="14" y2="22" stroke="#A6A6A6" stroke-width="3" stroke-dasharray="2 2"/>
    <rect x="10" y="22" width="8" height="6" fill="#F2F2F2"/>
  </g>
  <text x="636" y="79" class="mono" font-size="12" font-weight="600" fill="#F2F2F2">notes-archive.zip</text>
  <text x="636" y="95" class="mono" font-size="10.5" fill="#6E6E6E">[concept preview]</text>

  <!-- Loading Indicator -->
  <rect x="596" y="112" width="240" height="10" rx="3" fill="#000000" stroke="#303030" stroke-width="1"/>
  <rect x="596" y="112" width="180" height="10" rx="3" fill="#F2F2F2" class="zip-bar"/>

  <!-- Extraction Status Lines -->
  <text x="596" y="150" class="mono" font-size="12" fill="#A6A6A6">&gt; extracting knowledge...</text>
  <text x="596" y="174" class="mono zip-step2" font-size="12" fill="#F2F2F2">&gt; still learning...</text>
</svg>
