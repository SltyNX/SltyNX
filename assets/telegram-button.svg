<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 76" width="440" height="76" role="img" aria-label="Message me on Telegram @SltyNX_X">
  <title>Message me on Telegram (@SltyNX_X)</title>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .border-pulse { animation: bPulse 4s ease-in-out infinite; }
    @keyframes bPulse {
      0%, 100% { stroke: #303030; }
      50% { stroke: #A6A6A6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .border-pulse { animation: none !important; }
    }
  </style>
  <rect x="0" y="0" width="440" height="76" rx="8" fill="#000000"/>
  <rect x="1.5" y="1.5" width="437" height="73" rx="7" fill="#080808" stroke="#303030" stroke-width="1.4" class="border-pulse"/>

  <!-- Icon Box -->
  <rect x="16" y="14" width="48" height="48" rx="6" fill="#0D0D0D" stroke="#303030" stroke-width="1.2"/>
  <!-- Recognizable Telegram Paper Plane Icon -->
  <g transform="translate(40, 38) scale(1.2)">
    <path d="M -11 -1 L 10 -9 L 6 10 L 0 5.5 L -4 9 L -4 3.5 L 5 -4.5 L -6 2 Z" fill="#F2F2F2"/>
  </g>

  <!-- Primary & Secondary Text -->
  <text x="78" y="34" class="sans" font-size="17.5" font-weight="700" fill="#F2F2F2">Message me on Telegram</text>
  <text x="78" y="56" class="mono" font-size="14.5" fill="#A6A6A6">@SltyNX_X</text>

  <!-- Right Arrow Indicator Pill -->
  <rect x="346" y="23" width="76" height="30" rx="5" fill="#000000" stroke="#303030" stroke-width="1.2"/>
  <text x="384" y="43" text-anchor="middle" class="mono" font-size="13.5" font-weight="600" fill="#F2F2F2">open &#8594;</text>
</svg>
