<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Profile Introduction Terminal: Just a guy who sleeps a lot, codes a little, and dreams of building something cool. Currently a noob developer. Learning as I go, breaking things occasionally, and trying to understand how everything works.">
  <title>Profile Introduction — SltyNX (Sleeping Core)</title>
  <defs>
    <clipPath id="piClip0"><rect x="24" y="46" width="832" height="26" class="piline0"/></clipPath><clipPath id="piClip1"><rect x="24" y="80" width="832" height="26" class="piline1"/></clipPath><clipPath id="piClip2"><rect x="24" y="112" width="832" height="26" class="piline2"/></clipPath><clipPath id="piClip3"><rect x="24" y="136" width="832" height="26" class="piline3"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .piline0 { animation: piType0 22s steps(55, end) infinite; }
    @keyframes piType0 {
      0%, 40% { width: 832px; }
      41%, 43% { width: 0px; }
      49%, 100% { width: 832px; }
    }
.piline1 { animation: piType1 22s steps(55, end) infinite; }
    @keyframes piType1 {
      0%, 40% { width: 832px; }
      41%, 50% { width: 0px; }
      60%, 100% { width: 832px; }
    }
.piline2 { animation: piType2 22s steps(55, end) infinite; }
    @keyframes piType2 {
      0%, 40% { width: 832px; }
      41%, 61% { width: 0px; }
      69%, 100% { width: 832px; }
    }
.piline3 { animation: piType3 22s steps(55, end) infinite; }
    @keyframes piType3 {
      0%, 40% { width: 832px; }
      41%, 69% { width: 0px; }
      75%, 100% { width: 832px; }
    }
    .pi-cur { animation: piBlink 1s steps(2, start) infinite; }
    @keyframes piBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .piline0, .piline1, .piline2, .piline3 { animation: none !important; width: 832px !important; }
      .pi-cur { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- Outer Terminal Card Frame -->
  <rect x="0" y="0" width="880" height="190" rx="8" fill="#000000"/>
  <rect x="1" y="1" width="878" height="188" rx="7" fill="none" stroke="#303030" stroke-width="1"/>

  <!-- Top Terminal Header Strip -->
  <rect x="1.5" y="1.5" width="877" height="32" rx="6" fill="#080808"/>
  <line x1="1" y1="34" x2="879" y2="34" stroke="#303030" stroke-width="1"/>
  <circle cx="20" cy="17.5" r="4" fill="#383838"/>
  <circle cx="34" cy="17.5" r="4" fill="#383838"/>
  <circle cx="48" cy="17.5" r="4" fill="#383838"/>
  <text x="68" y="22" class="mono" font-size="11.5" fill="#A6A6A6">sltynx@sleeping-core: ~/profile (cat profile_intro.txt)</text>
  <text x="856" y="22" text-anchor="end" class="mono" font-size="11" fill="#6E6E6E">bio: Sleeping Core</text>

  <!-- Animated Terminal Typing Lines -->
  <text x="28" y="64" clip-path="url(#piClip0)" class="mono" font-size="13" fill="#F2F2F2" xml:space="preserve">$ cat profile_intro.txt</text><text x="28" y="98" clip-path="url(#piClip1)" class="mono" font-size="13" fill="#F2F2F2" xml:space="preserve">&gt; Just a guy who sleeps a lot, codes a little, and dreams of building something cool.</text><text x="28" y="130" clip-path="url(#piClip2)" class="mono" font-size="13" fill="#A6A6A6" xml:space="preserve">&gt; Currently a noob developer. Learning as I go, breaking things occasionally,</text><text x="28" y="154" clip-path="url(#piClip3)" class="mono" font-size="13" fill="#A6A6A6" xml:space="preserve">  and trying to understand how everything works.</text>

  <!-- Bottom Prompt & Blinking Cursor -->
  <text x="28" y="178" class="mono" font-size="13" fill="#6E6E6E">$ </text>
  <rect x="44" y="166" width="8" height="14" fill="#F2F2F2" class="pi-cur"/>
