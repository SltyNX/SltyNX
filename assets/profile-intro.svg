  <text x="24" y="68" clip-path="url(#piClip0)" class="mono" font-size="16.5" font-weight="700" fill="#F2F2F2" xml:space="preserve">$ cat profile_intro.txt</text><text x="24" y="104" clip-path="url(#piClip1)" class="mono" font-size="15.5" fill="#F2F2F2" xml:space="preserve">&gt; Just a guy who sleeps a lot, codes a little,</text><text x="24" y="130" clip-path="url(#piClip2)" class="mono" font-size="15.5" fill="#F2F2F2" xml:space="preserve">  and dreams of building something cool.</text><text x="24" y="166" clip-path="url(#piClip3)" class="mono" font-size="15.5" fill="#A6A6A6" xml:space="preserve">&gt; Currently a noob developer. Learning as I go,</text><text x="24" y="192" clip-path="url(#piClip4)" class="mono" font-size="15.5" fill="#A6A6A6" xml:space="preserve">  breaking things occasionally, and trying to</text><text x="24" y="218" clip-path="url(#piClip5)" class="mono" font-size="15.5" fill="#A6A6A6" xml:space="preserve">  understand how everything works.</text>

