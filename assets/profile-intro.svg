    .piline0 { animation: piType0 12s steps(45, end) infinite; }
    @keyframes piType0 {
      0%, 3% { width: 0px; }
      12%, 94% { width: 600px; }
      98%, 100% { width: 0px; }
    }
.piline1 { animation: piType1 12s steps(45, end) infinite; }
    @keyframes piType1 {
      0%, 15% { width: 0px; }
      30%, 94% { width: 600px; }
      98%, 100% { width: 0px; }
    }
.piline2 { animation: piType2 12s steps(45, end) infinite; }
    @keyframes piType2 {
      0%, 30% { width: 0px; }
      44%, 94% { width: 600px; }
      98%, 100% { width: 0px; }
    }
.piline3 { animation: piType3 12s steps(45, end) infinite; }
    @keyframes piType3 {
      0%, 48% { width: 0px; }
      63%, 94% { width: 600px; }
      98%, 100% { width: 0px; }
