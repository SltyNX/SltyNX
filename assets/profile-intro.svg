<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" role="img" aria-label="Profile Introduction Terminal: Just a guy who sleeps a lot, codes a little, and dreams of building something cool. Currently a noob developer. Learning as I go, breaking things occasionally, and trying to understand how everything works.">
  <title>Profile Introduction — SltyNX (Sleeping Core)</title>
  <defs>
