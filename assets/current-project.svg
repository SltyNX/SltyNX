  <circle cx="212" cy="62" r="3.5" fill="#F2F2F2" class="pulse-dot"/>
  <text x="224" y="66" class="mono" font-size="11" fill="#F2F2F2">In Progress</text>

  <!-- Description (2 clean lines within left column) -->
  <text x="24" y="98" class="sans" font-size="13.5" fill="#A6A6A6">A custom Android keyboard focused on control, customization,</text>
  <text x="24" y="118" class="sans" font-size="13.5" fill="#A6A6A6">and a better typing experience.</text>

