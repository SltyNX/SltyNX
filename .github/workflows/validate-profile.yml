name: Validate & Regenerate Profile Assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - ".github/workflows/validate-profile.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sltynx-profile-validate
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate deterministic SVG assets
        run: python3 scripts/generate.py

      - name: Validate XML, bounds, IDs, and README links
        run: python3 scripts/validate_assets.py

      - name: Commit updated SVG assets if changed
        run: |
          if [ -n "$(git status --porcelain assets/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/*.svg
            git commit -m "chore: regenerate profile svg assets"
            git push
          fi
